<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Chatbot</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Helvetica', Arial, sans-serif;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        margin: 0;
        padding: 20px 10px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .header-container {
        text-align: center;
        margin-bottom: 15px;
      }
      h2 {
        background-color: white;
        border: 2px solid black;
        border-radius: 5px;
        color: #03989E;
        display: inline-block;
        margin: 5px;
        padding: 8px 16px;
      }
      h4 {
        margin: 8px 0;
        color: #333;
        text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
      }
      .chat-container {
        width: 100%;
        max-width: 550px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #chatbox {
        height: 60vh;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .userText, .botText {
        max-width: 80%;
        width: fit-content;
        line-height: 20px;
        border-radius: 5px;
        font-size: 13px;
        margin: 2px 0;
        word-wrap: break-word;
      }
      .userText {
        align-self: flex-end;
        color: white;
        background-color: #FF9351;
      }
      .userText span, .botText span {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 5px;
      }
      .botText {
        align-self: flex-start;
        color: white;
        background-color: #00C2CB;
      }
      .botText.error {
        background-color: #d9534f;
      }
      #userInput {
        display: flex;
        border-top: 1px solid #ddd;
        background-color: #fff;
        padding: 10px;
      }
      #nameInput {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 10px 14px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
      }
      #nameInput:focus {
        border-color: #03989E;
      }
      #sendButton {
        background-color: #03989E;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 10px 18px;
        margin-left: 8px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      #sendButton:hover {
        background-color: #027a7f;
      }
    </style>
  </head>
  <body style="background-image: url('{{ url_for('static', filename='images/slider.jpg') }}');">
    <div class="header-container">
      <h2>Welcome to Aindri's Restro</h2>
      <h4>You are chatting with our customer support bot!</h4>
    </div>

    <div class="chat-container">
      <div id="chatbox">
        <p class="botText"><span><b>Restrobot : </b>Hello! How can I assist you with our restaurant today?</span></p>
      </div>
      <div id="userInput">
        <input id="nameInput" type="text" name="msg" placeholder="Ask me anything..." autocomplete="off" />
        <button id="sendButton" type="button" onclick="getBotResponse()">Send</button>
      </div>
    </div>

    <script>
      function escapeHtml(text) {
        return $("<div>").text(text).html();
      }

      function scrollToBottom() {
        var chatbox = $("#chatbox");
        chatbox.scrollTop(chatbox[0].scrollHeight);
      }

      function getBotResponse() {
        var inputField = $("#nameInput");
        var rawText = inputField.val().trim();
        if (!rawText) {
          return;
        }

        var safeUserText = escapeHtml(rawText);
        var userHtml = '<p class="userText"><span><b>You : </b>' + safeUserText + '</span></p>';
        inputField.val("");
        $("#chatbox").append(userHtml);
        scrollToBottom();

        $.get("/get", { msg: rawText })
          .done(function(data) {
            var safeBotText = escapeHtml(data);
            var botHtml = '<p class="botText"><span><b>Restrobot : </b>' + safeBotText + '</span></p>';
            $("#chatbox").append(botHtml);
            scrollToBottom();
          })
          .fail(function() {
            var errorHtml = '<p class="botText error"><span><b>Restrobot : </b>Sorry, there was an issue connecting to the server. Please try again.</span></p>';
            $("#chatbox").append(errorHtml);
            scrollToBottom();
          });
      }

      $("#nameInput").on("keypress", function(e) {
        if (e.which === 13) {
          getBotResponse();
        }
      });
    </script>
  </body>
</html>
